<!doctype html>
<html lang="es" class="h-full bg-black">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#050b14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Warheads" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <title>Warheads: Versión Compas - Artillería Orbital</title>
    <meta name="description" content="Clon avanzado, fotorrealista y optimizado para móviles del clásico de culto WarHeads (1997) con gravedad Plummer, 20 armas canónicas y planetas destructibles." />
    <meta property="og:title" content="Warheads: Versión Compas - Artillería Orbital" />
    <meta property="og:description" content="Clon táctico orbital de WarHeads (1997) con gravedad Plummer, física toroidal y planetas destructibles." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- QRCode.js CDN for Online Room QR generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <!-- Firebase SDK Compat CDN for Online Room syncing -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <!-- PWA Web App Manifest dinámico (Data URI) & Service Worker (Blob URL) -->
    <script>
      (function() {
        const iconSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" fill="#030712"/><circle cx="256" cy="256" r="160" fill="#0284c7" stroke="#38bdf8" stroke-width="12"/><ellipse cx="256" cy="256" rx="230" ry="80" fill="none" stroke="#22d3ee" stroke-width="10" stroke-dasharray="20 15" transform="rotate(-25 256 256)"/><polygon points="256,120 290,280 256,250 222,280" fill="#f59e0b"/><circle cx="256" cy="256" r="28" fill="#ef4444"/></svg>`;
        const iconDataUri = 'data:image/svg+xml;base64,' + btoa(iconSvg);
        
        const manifest = {
          id: "/",
          name: "Warheads: Versión Compas",
          short_name: "Warheads",
          description: "Clon avanzado de artillería orbital táctica WarHeads (1997).",
          start_url: "./",
          scope: "./",
          display: "standalone",
          orientation: "portrait",
          theme_color: "#050b14",
          background_color: "#020408",
          icons: [
            { src: iconDataUri, sizes: "192x192 512x512", type: "image/svg+xml", purpose: "any" },
            { src: iconDataUri, sizes: "192x192 512x512", type: "image/svg+xml", purpose: "maskable" }
          ]
        };

        const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
        const manifestLink = document.createElement('link');
        manifestLink.rel = 'manifest';
        manifestLink.href = URL.createObjectURL(manifestBlob);
        document.head.appendChild(manifestLink);

        const appleTouchIcon = document.createElement('link');
        appleTouchIcon.rel = 'apple-touch-icon';
        appleTouchIcon.href = iconDataUri;
        document.head.appendChild(appleTouchIcon);

        // Registro de Service Worker mínimo para instalación PWA
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', () => {
            const swCode = `
              const CACHE_NAME = 'warheads-cache-v1';
              self.addEventListener('install', (e) => { self.skipWaiting(); });
              self.addEventListener('activate', (e) => { e.waitUntil(clients.claim()); });
              self.addEventListener('fetch', (e) => {
                e.respondWith(
                  fetch(e.request).catch(() => caches.match(e.request))
                );
              });
            `;
            const swBlob = new Blob([swCode], { type: 'application/javascript' });
            navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(() => {});
          });
        }
      })();
    </script>
  </head>
  <body class="h-full m-0 p-0 overflow-hidden bg-black text-slate-100 select-none">
    <div id="root" class="h-full w-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
